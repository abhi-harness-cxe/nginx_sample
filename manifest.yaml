apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-rollout
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: abc
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 30s

---

apiVersion: v1
kind: Secret
metadata:
  name: abc
type: Opaque
stringData:
  USERNAME: admin
  PASSWORD: password123
